# Publishes the static telecom demo (telecom-demo/) to GitHub Pages.
# Repo setting needed once (admin): Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# After that, run it from Actions -> "Deploy telecom demo to GitHub Pages" -> Run workflow;
# later pushes that change telecom-demo/ redeploy automatically.
name: Deploy telecom demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'telecom-demo/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: telecom-demo
      - id: deployment
        uses: actions/deploy-pages@v4
